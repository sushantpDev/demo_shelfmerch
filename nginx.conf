# nginx.conf
# Nginx configuration for demo_shelfmerch project
# -------------------------------------------------
# This config serves the React frontend (built static files) and proxies
# API requests to the Node.js backend.
# Adjust the server_name, ports, and paths as needed for your VPS.

# DNS A record should point example.com (or your domain) to this VPS IP.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # -------------------------------------------------
    # Frontend - serve built React app
    # -------------------------------------------------
    server {
        listen 80;
        server_name example.com;  # <-- replace with your domain or IP

        # Root directory for built static files
        root   /var/www/demo_shelfmerch/frontend/build;
        index  index.html index.htm;

        # Serve static assets directly
        location /static/ {
            try_files $uri $uri/ =404;
        }

        # All other routes should be handled by React (client-side routing)
        location / {
            try_files $uri /index.html;
        }

        # -------------------------------------------------
        # Backend API proxy
        # -------------------------------------------------
        # Assuming backend Node server listens on localhost:5000
        location /api/ {
            proxy_pass http://127.0.0.1:5000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Optional: WebSocket support if backend uses it
        location /socket.io/ {
            proxy_pass http://127.0.0.1:5000/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # Logging
        access_log /var/log/nginx/demo_shelfmerch.access.log;
        error_log  /var/log/nginx/demo_shelfmerch.error.log;
    }
}
